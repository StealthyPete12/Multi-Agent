# Production-oriented stack.
#
# Differences from docker-compose.dev.yml (which is optimized for "clone
# and run" clarity):
#   - No source bind-mounts; every service runs a built, tagged image.
#   - Resource limits on every container (deploy.resources).
#   - Persistence is configurable: every volume below binds to a host path
#     driven by an env var (default ./data/<service>), so an operator can
#     point it at a real mounted disk/NFS share/EBS volume without editing
#     this file — set e.g. POSTGRES_DATA_DIR=/mnt/disks/pgdata in .env.
#   - Only the ports an operator actually needs from outside the Docker
#     host are published (watcher's webhook endpoint, Grafana). Everything
#     else (RabbitMQ AMQP/management, Postgres, Redis, Prometheus, Phoenix)
#     is reachable only from other containers on the swarm-prod network —
#     bind those explicitly in an override file if you need external access
#     (e.g. for `psql` from an operator workstation).
#   - No default credentials: every secret-shaped value has no fallback
#     and docker compose refuses to start without it, instead of silently
#     running with a well-known dev password.
#
# This still runs on a single Docker host (no orchestrator-level
# scheduling/replication) — see docs/runbooks/deploy.md for a real
# deployment checklist and docs/architecture.md for the topology this
# assumes. RabbitMQ/Postgres/Redis remain single instances; scaling the
# three agents horizontally is safe (see README's "Consumer hygiene" —
# prefetch=1, idempotent claims) and is the first thing to change under
# load, via `docker compose -f docker-compose.prod.yml up -d --scale
# researcher=3 --scale reviewer=3`. Watcher must stay at one replica
# unless a load balancer sits in front of it (it's a stateless FastAPI
# app, so that's a routing decision, not a code one).

name: swarm-prod

x-agent-common: &agent-common
  environment: &agent-env
    ENVIRONMENT: production
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
    RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-swarm.events}
    RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
    DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-code_review_swarm}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    LLM_PROVIDER: ${LLM_PROVIDER:-none}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    MODEL_SELECTIONS: ${MODEL_SELECTIONS:-}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    REPO_WEB_BASE_URL: ${REPO_WEB_BASE_URL:-https://github.com/}
    RISK_SCORE_MODERATE_THRESHOLD: ${RISK_SCORE_MODERATE_THRESHOLD:-3}
    RISK_SCORE_HIGH_THRESHOLD: ${RISK_SCORE_HIGH_THRESHOLD:-6}
    RISK_SCORE_CRITICAL_THRESHOLD: ${RISK_SCORE_CRITICAL_THRESHOLD:-10}
    RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-60}
    QUEUE_DLQ: ${QUEUE_DLQ:-q.dlq}
    RETRY_DELAY_5S_MS: ${RETRY_DELAY_5S_MS:-5000}
    RETRY_DELAY_30S_MS: ${RETRY_DELAY_30S_MS:-30000}
    RETRY_DELAY_5M_MS: ${RETRY_DELAY_5M_MS:-300000}
    GRACEFUL_SHUTDOWN_SECONDS: ${GRACEFUL_SHUTDOWN_SECONDS:-30}
    IDEMPOTENCY_STALE_CLAIM_SECONDS: ${IDEMPOTENCY_STALE_CLAIM_SECONDS:-300}
    LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
    LLM_RETRY_BACKOFF_BASE_SECONDS: ${LLM_RETRY_BACKOFF_BASE_SECONDS:-1.0}
    LLM_RETRY_BACKOFF_MAX_SECONDS: ${LLM_RETRY_BACKOFF_MAX_SECONDS:-20.0}
    LLM_BREAKER_FAILURE_THRESHOLD: ${LLM_BREAKER_FAILURE_THRESHOLD:-5}
    LLM_BREAKER_OPEN_SECONDS: ${LLM_BREAKER_OPEN_SECONDS:-60}
    LLM_RATE_LIMIT_ENABLED: ${LLM_RATE_LIMIT_ENABLED:-true}
    RATE_LIMIT_TOKENS_PER_MINUTE: ${RATE_LIMIT_TOKENS_PER_MINUTE:-60}
    RATE_LIMIT_MAX_WAIT_SECONDS: ${RATE_LIMIT_MAX_WAIT_SECONDS:-60}
    OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp_http}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
    OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-prometheus}
    OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always
  networks: [swarm-prod]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - type: bind
        source: ${RABBITMQ_DATA_DIR:-./data/rabbitmq}
        target: /var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks: [swarm-prod]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-code_review_swarm}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./data/postgres}
        target: /var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-code_review_swarm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks: [swarm-prod]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - type: bind
        source: ${REDIS_DATA_DIR:-./data/redis}
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks: [swarm-prod]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-code_review_swarm}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9187/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks: [swarm-prod]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - type: bind
        source: ${PHOENIX_DATA_DIR:-./data/phoenix}
        target: /mnt/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    networks: [swarm-prod]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - type: bind
        source: ${PROMETHEUS_DATA_DIR:-./data/prometheus}
        target: /prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks: [swarm-prod]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - type: bind
        source: ${GRAFANA_DATA_DIR:-./data/grafana}
        target: /var/lib/grafana
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/datasources.dev.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    networks: [swarm-prod]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  watcher:
    image: ${IMAGE_REGISTRY:-code-review-swarm}/watcher:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: agents/watcher/Dockerfile
    <<: *agent-common
    environment:
      <<: *agent-env
      WATCHER_PORT: "8001"
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required}
      WATCHED_BRANCHES: ${WATCHED_BRANCHES:-main}
    ports:
      - "${WATCHER_PORT:-8001}:8001"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  researcher:
    image: ${IMAGE_REGISTRY:-code-review-swarm}/researcher:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: agents/researcher/Dockerfile
    <<: *agent-common
    environment:
      <<: *agent-env
      REPO_CLONE_BASE_URL: ${REPO_CLONE_BASE_URL:-https://github.com/}
      REPO_STALE_SECONDS: ${REPO_STALE_SECONDS:-300}
      BLAST_RADIUS_MAX_DEPTH: ${BLAST_RADIUS_MAX_DEPTH:-10}
      SENSITIVE_PATH_PATTERNS: ${SENSITIVE_PATH_PATTERNS:-auth/,payments/,infra/,migrations/}
      RESEARCHER_METRICS_PORT: "9102"
    volumes:
      - type: bind
        source: ${RESEARCHER_REPO_CACHE_DIR:-./data/researcher-repo-cache}
        target: /var/lib/swarm/repo-cache
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  reviewer:
    image: ${IMAGE_REGISTRY:-code-review-swarm}/reviewer:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: agents/reviewer/Dockerfile
    <<: *agent-common
    environment:
      <<: *agent-env
      REVIEWER_METRICS_PORT: "9103"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

networks:
  swarm-prod:
