[project]
name = "code-review-swarm"
version = "0.1.0"
description = "Event-Driven Multi-Agent Code Review Swarm"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "aio-pika>=9.4,<10",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "redis>=5.0,<6",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.7",
    "black>=24.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "agents*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.egg-info", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is black's job
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "agents", "tools"]

[tool.mypy]
python_version = "3.11"
packages = ["shared", "agents", "tools"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/", "build/", "dist/"]
