[project]
name = "code-review-swarm"
version = "0.1.0"
description = "Event-Driven Multi-Agent Code Review Swarm"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "aio-pika>=9.4,<10",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "agents*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
